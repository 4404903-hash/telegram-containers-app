<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Тест 3D-машини</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #18252b;
    }

    #carScene {
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-family: Arial, sans-serif;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="status">Завантаження машини…</div>
  <div id="carScene"></div>

  <script type="module" src="/js/car-test.js"></script>
</body>
</html>
