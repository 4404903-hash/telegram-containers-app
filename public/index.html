<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101c20"><title>Єдиний автобазар</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/socket.io/socket.io.js"></script>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head><body>
<main id="game">
  <div id="scene" aria-label="3D-площадка автобазару"></div>
  <div class="top-shade"></div>
  <header>
    <button class="profile glass" data-action="office"><span class="avatar">👨🏻</span><span><b id="playerName">Гравець</b><small id="playerRating">Ваш автомобіль. Ваша угода.</small><span class="profile-track"><i></i></span><small id="connection">Підключення…</small></span></button>
    <div class="market-title"><h1>Єдиний автобазар</h1><span>100 паркомісць</span><small id="occupancy">Завантажуємо площадку</small></div>
    <button id="daily" class="daily glass"><span>🎁</span><span><small>Щоденний бонус</small><b id="dailyLabel">Отримати +5 💎</b></span></button>
    <div class="top-actions"><button class="glass balance" data-action="crystals">💎 <b id="balance">0</b><span class="plus">+</span></button><button class="glass settings" data-action="settings" aria-label="Налаштування">⚙</button></div>
  </header>
  <form id="quickSearchForm" class="quick-search glass"><span>⌕</span><input id="quickSearch" placeholder="Марка або модель" aria-label="Пошук на автобазарі"><button id="openFilters" type="button" aria-label="Фільтри">☷</button></form>
  <nav class="side-nav" aria-label="Меню гри">
    <button class="glass" data-action="office"><span>▦</span><b>ОФІС</b></button>
    <button class="glass" data-action="garage"><span>🚘</span><b>МОЇ АВТО</b><i id="myCount">0</i></button>
    <button class="glass" data-action="favorites"><span>♡</span><b>ОБРАНЕ</b></button>
    
    <button class="glass developer-button" data-action="developer"><span>➤</span><b>РОЗРОБНИК<small id="developerName">@s_5994</small></b></button>
  </nav>
  <div id="demoBanner" class="demo-banner hidden">ДЕМО · тестові оголошення <button id="demoPopulate">Додати приклади</button></div>
  <div class="map-info glass"><span class="live-dot"></span><span id="mapArea">Центральна площадка · 1–30</span><button id="nextArea" title="Наступний сектор">→</button></div>
  <div id="hint" class="hint glass">Натисніть на авто, щоб переглянути деталі</div>
  <div class="zoom-controls"><button id="zoomIn" class="glass" aria-label="Наблизити">+</button><button id="zoomOut" class="glass" aria-label="Віддалити">−</button><button id="resetCamera" class="glass" aria-label="До входу">⌂</button></div>
  <div class="joystick glass" aria-label="Пересування камери"><button data-pan="up" aria-label="Уперед">▲</button><button data-pan="left" aria-label="Ліворуч">◀</button><button data-pan="right" aria-label="Праворуч">▶</button><button data-pan="down" aria-label="Назад">▼</button><div></div></div>
  <footer><button data-action="catalog">⌕ <span>ВЕСЬ АВТОБАЗАР</span></button><button class="sell-main" data-action="sell">＋ <span>ПРОДАТИ АВТО</span></button><button data-action="chats">☏ <span>МОЇ ЧАТИ</span><i id="unread" class="hidden">0</i></button></footer>
</main>
<div id="loading" role="status"><div class="loader-logo">AUTO<span>BAZAR</span></div><div class="loading-line"></div><p id="loadingText">Готуємо вашу площадку…</p><button id="retry" class="secondary hidden">Спробувати ще раз</button></div>
<dialog id="modal"><div class="modal-head"><div><small id="modalEyebrow">AUTO BAZAR</small><h2 id="modalTitle"></h2></div><button id="closeModal" aria-label="Закрити">×</button></div><div id="modalBody"></div></dialog>
<div id="toast" role="status" class="hidden"></div>
<script type="module" src="/js/app.js"></script>
</body></html>
