<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1,
    maximum-scale=1, user-scalable=no"
  >

  <title>AutoBazar 3D</title>

  <link
    rel="stylesheet"
    href="/css/game3d.css?v=1"
  >

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <main id="game">
    <div id="threeScene"></div>

    <div id="loadingScreen">
      <div class="loader"></div>
      <strong>AutoBazar 3D</strong>
      <span id="loadingStatus">Завантаження гри…</span>
    </div>

    <header class="top-bar">
      <div>
        <strong>AutoBazar</strong>
        <small>20 паркомісць</small>
      </div>

      <button id="inboxButton" class="round-button">
        💬
        <b id="messageBadge" class="hidden">0</b>
      </button>
    </header>

    <nav class="bottom-menu">
      <button id="buyButton" class="menu-button active">
        <span>🚗</span>
        <small>Купити</small>
      </button>

      <button id="sellButton" class="menu-button">
        <span>＋</span>
        <small>Продати</small>
      </button>

      <button id="chatsButton" class="menu-button">
        <span>💬</span>
        <small>Чати</small>
      </button>

      <button id="myListingsButton" class="menu-button">
        <span>📋</span>
        <small>Мої</small>
      </button>
    </nav>

    <section id="sellPanel" class="panel hidden">
      <div class="panel-header">
        <strong>Продати автомобіль</strong>
        <button class="close-panel" data-close="sellPanel">✕</button>
      </div>

      <form id="sellForm">
        <input
          name="brand"
          placeholder="Марка"
          maxlength="30"
          required
        >

        <input
          name="model"
          placeholder="Модель"
          maxlength="30"
          required
        >

        <input
          name="year"
          type="number"
          placeholder="Рік"
          min="1950"
          max="2030"
          required
        >

        <input
          name="price"
          type="number"
          placeholder="Ціна, $"
          min="1"
          required
        >

        <textarea
          name="description"
          placeholder="Опис автомобіля"
          maxlength="700"
          required
        ></textarea>

        <button type="submit" class="primary-button">
          Виставити автомобіль
        </button>
      </form>
    </section>

    <section id="chatsPanel" class="panel hidden">
      <div class="panel-header">
        <strong>Чати</strong>
        <button class="close-panel" data-close="chatsPanel">✕</button>
      </div>

      <div id="conversationsList" class="panel-content">
        Чатів поки немає
      </div>
    </section>

    <section id="myListingsPanel" class="panel hidden">
      <div class="panel-header">
        <strong>Мої оголошення</strong>
        <button
          class="close-panel"
          data-close="myListingsPanel"
        >
          ✕
        </button>
      </div>

      <div id="myListingsList" class="panel-content">
        Оголошень поки немає
      </div>
    </section>

    <section id="carPanel" class="panel hidden">
      <div class="panel-header">
        <strong id="carPanelTitle">Автомобіль</strong>
        <button class="close-panel" data-close="carPanel">✕</button>
      </div>

      <div id="carPanelContent" class="panel-content"></div>
    </section>
  </main>

  <script
    type="module"
    src="/js/game3d/main.js?v=1"
  ></script>
</body>
</html>
